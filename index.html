<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Müzik">
  <title>Müzik Çalar</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <header class="top">
    <h1>🎵 Müzik</h1>
    <nav class="tabs">
      <button class="tab active" data-tab="search">Ara</button>
      <button class="tab" data-tab="radio">Radyo</button>
      <button class="tab" data-tab="favs">Favoriler</button>
      <button class="tab" data-tab="local">Kitaplığım</button>
    </nav>
  </header>

  <main>
    <section id="tab-search" class="panel active">
      <form id="search-form" class="search" autocomplete="off">
        <input id="search-input" type="search" placeholder="Şarkı veya sanatçı adı yaz…" enterkeyhint="search">
        <button type="submit" aria-label="Ara">Ara</button>
      </form>
      <div id="popular">
        <h2 class="sec-title">🔥 Popüler şarkılar</h2>
        <div id="genres" class="chips"></div>
      </div>
      <div id="results-head" class="results-head hidden">
        <span id="results-title"></span>
        <button id="back-popular" type="button">← Popüler</button>
      </div>
      <p id="status" class="status">Yükleniyor…</p>
      <ul id="results" class="list"></ul>
    </section>

    <section id="tab-radio" class="panel">
      <div class="search">
        <input id="radio-filter" type="search" placeholder="Radyo ara (ör. Kral, Power, Rap)…">
      </div>
      <div id="radio-cats" class="chips"></div>
      <p id="radio-status" class="status">Yükleniyor…</p>
      <ul id="radios" class="list"></ul>
    </section>

    <section id="tab-favs" class="panel">
      <ul id="favs" class="list"></ul>
      <p id="favs-empty" class="status">Henüz favori yok. Şarkıların yanındaki ♡ ile ekle.</p>
    </section>

    <section id="tab-local" class="panel">
      <label class="file-btn">
        + Şarkı ekle
        <input id="file-input" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg" multiple hidden>
      </label>
      <p id="lib-info" class="status">Eklediğin şarkılar telefonda saklanır; internetsiz, arka planda ve kilit ekranında çalar.</p>
      <div id="lib-tools" class="lib-tools hidden">
        <input id="lib-filter" type="search" placeholder="Kitaplıkta ara…">
        <button id="lib-playall" type="button">▶ Tümünü çal</button>
      </div>
      <ul id="local" class="list"></ul>
    </section>
  </main>

  <footer id="player" class="player hidden">
    <div class="now">
      <img id="np-art" alt="">
      <div class="np-text">
        <div id="np-title" class="np-title"></div>
        <div id="np-artist" class="np-artist"></div>
      </div>
      <button id="np-fav" class="icon" aria-label="Favori">♡</button>
    </div>
    <div id="live" class="live hidden">● CANLI YAYIN</div>
    <div id="seek-row" class="seek">
      <span id="t-cur">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" step="1">
      <span id="t-dur">0:00</span>
    </div>
    <div class="controls">
      <button id="btn-shuffle" class="icon small" aria-label="Karıştır">🔀</button>
      <button id="btn-prev" class="icon" aria-label="Önceki">⏮</button>
      <button id="btn-play" class="icon big" aria-label="Oynat">▶</button>
      <button id="btn-next" class="icon" aria-label="Sonraki">⏭</button>
      <button id="btn-repeat" class="icon small" aria-label="Tekrarla">🔁</button>
    </div>
  </footer>

  <audio id="audio" preload="auto" playsinline></audio>
  <script src="app.js?v=6"></script>
</body>
</html>
