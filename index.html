<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gök Kaçışı">
<title>Gök Kaçışı</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<style>
  :root { --bg:#0b1026; --fg:#f2f4ff; --accent:#ffd166; --accent2:#06d6a0; --danger:#ef476f; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas { display:block; width:100vw; height:100vh; height:100dvh; }
  #hud { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center;
    padding:calc(env(safe-area-inset-top) + 10px) 16px 10px; font-weight:700; font-size:18px; pointer-events:none; }
  #hud .lives { color:var(--danger); letter-spacing:2px; }
  #pauseBtn { pointer-events:auto; background:rgba(255,255,255,.12); border:0; color:var(--fg); width:40px; height:40px;
    border-radius:12px; font-size:18px; }
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:24px; background:rgba(11,16,38,.82); backdrop-filter:blur(4px); }
  .hidden { display:none !important; }
  h1 { margin:0; font-size:42px; background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p { margin:0; opacity:.85; line-height:1.5; max-width:320px; }
  .big { font-size:30px; font-weight:800; }
  button.primary { background:var(--accent); color:#1a1a1a; border:0; border-radius:16px; padding:16px 40px;
    font-size:20px; font-weight:800; box-shadow:0 6px 0 #c99a2e; }
  button.primary:active { transform:translateY(4px); box-shadow:0 2px 0 #c99a2e; }
  button.ghost { background:transparent; color:var(--fg); border:2px solid rgba(255,255,255,.3); border-radius:14px; padding:10px 24px; font-size:16px; }
  .legend { display:flex; gap:18px; font-size:14px; opacity:.9; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden">
  <span id="score">0</span>
  <span class="lives" id="lives"></span>
  <button id="pauseBtn" aria-label="Duraklat">❚❚</button>
</div>

<div id="menu" class="screen">
  <h1>Gök Kaçışı</h1>
  <p>Parmağını sürükleyerek gemini yönet. Meteorlardan kaç, yıldızları topla!</p>
  <div class="legend"><span>⭐ +10</span><span>🛡️ Kalkan</span><span>❤️ Can</span></div>
  <p>En yüksek skor: <b id="bestMenu">0</b></p>
  <button class="primary" id="startBtn">OYNA</button>
  <button class="ghost" id="soundBtn">Ses: Açık</button>
</div>

<div id="paused" class="screen hidden">
  <div class="big">Duraklatıldı</div>
  <button class="primary" id="resumeBtn">DEVAM</button>
  <button class="ghost" id="quitBtn">Ana Menü</button>
</div>

<div id="over" class="screen hidden">
  <div class="big">Oyun Bitti</div>
  <p>Skor: <b id="finalScore">0</b></p>
  <p id="newBest" class="hidden" style="color:var(--accent);font-weight:800">Yeni rekor! 🎉</p>
  <p>En yüksek: <b id="bestOver">0</b></p>
  <button class="primary" id="againBtn">TEKRAR</button>
  <button class="ghost" id="menuBtn">Ana Menü</button>
</div>

<script src="game.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
