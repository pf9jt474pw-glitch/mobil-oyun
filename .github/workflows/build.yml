name: Uygulamaları derle

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android APK (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: melodim
            dir: muzik
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Debug APK derle
        working-directory: ${{ matrix.dir }}/android
        run: ./gradlew assembleDebug --no-daemon
      - name: APK'yı adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ${{ matrix.name }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-android-apk
          path: ${{ matrix.dir }}/${{ matrix.name }}.apk

  ios:
    name: iOS simülatör derlemesi (${{ matrix.name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: melodim
            dir: muzik
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci
      - run: npx cap sync ios
      - name: Xcode ile derle (imzasız)
        working-directory: ${{ matrix.dir }}/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
