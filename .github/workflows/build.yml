name: Uygulamaları derle

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Debug APK derle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gok-kacisi-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iOS (simülatör derlemesi)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - name: Xcode ile derle (imzasız)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: .app paketle
        run: cd ios/App/build/Build/Products/Debug-iphonesimulator && zip -qr ../../../../../../gok-kacisi-ios-simulator.zip App.app
      - uses: actions/upload-artifact@v4
        with:
          name: gok-kacisi-ios-simulator
          path: gok-kacisi-ios-simulator.zip
